<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 物聯網控制中心</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; }
        h1 { font-size: 1.5rem; color: #333; }
        .status-box { margin: 20px 0; padding: 10px; border-radius: 8px; background: #eee; font-weight: bold; }
        button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .btn-on { background-color: #4CAF50; color: white; }
        .btn-off { background-color: #f44336; color: white; }
        button:hover { opacity: 0.8; }
        #conn-status { font-size: 0.8rem; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>ESP32 遠端控制</h1>
        
        <div class="status-box" id="btnDisplay">按鈕狀態：等待中...</div>

        <button class="btn-on" onclick="sendCmd('ON')">點亮內建 LED</button>
        <button class="btn-off" onclick="sendCmd('OFF')">關閉內建 LED</button>

        <div id="conn-status">正在嘗試連線到伺服器...</div>
    </div>

    <script>
        const broker = "broker.emqx.io";
        const port = 8084; // WSS Port
        const clientId = "WebClient_" + Math.random().toString(16).substr(2, 8);
        
        const topicLed = "ginohome/esp32/led";
        const topicBtn = "ginohome/esp32/button";

        const client = new Paho.MQTT.Client(broker, port, clientId);

        client.onConnectionLost = (res) => {
            document.getElementById("conn-status").innerText = "連線中斷，正在重連...";
            setTimeout(() => client.connect(options), 5000);
        };

        client.onMessageArrived = (msg) => {
            if (msg.destinationName === topicBtn) {
                document.getElementById("btnDisplay").innerText = "按鈕狀態：" + msg.payloadString;
            }
        };

        const options = {
            useSSL: true,
            onSuccess: () => {
                document.getElementById("conn-status").innerText = "連線狀態：已連線 (SSL)";
                client.subscribe(topicBtn);
            },
            onFailure: (err) => {
                document.getElementById("conn-status").innerText = "連線失敗: " + err.errorMessage;
            }
        };

        client.connect(options);

        function sendCmd(state) {
            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(state);
                message.destinationName = topicLed;
                client.send(message);
            } else {
                alert("尚未連線");
            }
        }
    </script>
</body>
</html>
