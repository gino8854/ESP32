<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding-top: 50px; }
        
        /* 卡片設計 */
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        
        /* 狀態指示燈 */
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .bg-online { background-color: #27ae60; }
        .bg-offline { background-color: #c0392b; }
        
        /* 顯示區塊 */
        #status-box { font-size: 1.5em; font-weight: bold; margin: 25px 0; padding: 20px; border-radius: 10px; transition: all 0.3s ease; }
        .taken { background-color: #d4edda; color: #155724; }
        .waiting { background-color: #e2e3e5; color: #383d41; }
        
        .network-row { display: flex; justify-content: space-around; font-size: 0.9em; color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <h2>智慧藥盒監控</h2>
        
        <div class="network-row">
            <div><span id="browser-dot" class="status-dot"></span>網路</div>
            <div><span id="mqtt-dot" class="status-dot"></span>MQTT</div>
        </div>

        <div id="status-box" class="waiting">載入中...</div>
        <p style="font-size: 0.8em; color: #999;">系統運作正常</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script>
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_" + parseInt(Math.random() * 100));
        const statusBox = document.getElementById("status-box");
        const bDot = document.getElementById("browser-dot");
        const mDot = document.getElementById("mqtt-dot");

        function setStatus(el, online) {
            el.className = "status-dot " + (online ? "bg-online" : "bg-offline");
        }

        // 網路檢查
        window.addEventListener('online', () => setStatus(bDot, true));
        window.addEventListener('offline', () => setStatus(bDot, false));
        setStatus(bDot, navigator.onLine);

        // MQTT 邏輯
        client.onConnectionLost = () => setStatus(mDot, false);
        client.onMessageArrived = (msg) => {
            const isTaken = msg.payloadString === "Taken";
            statusBox.innerHTML = isTaken ? "✅ 藥物已領取" : "🕒 等待取藥中";
            statusBox.className = "waiting " + (isTaken ? "taken" : "");
        };

        client.connect({
            useSSL: true,
            onSuccess: () => {
                setStatus(mDot, true);
                client.subscribe("pillbox/status");
                statusBox.innerHTML = "等待指令中...";
            },
            onFailure: () => setStatus(mDot, false)
        });
    </script>
</body>
</html>
