<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧藥盒監控中心</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding-top: 30px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .bg-online { background-color: #27ae60; } .bg-offline { background-color: #c0392b; }
        #schedule-list { text-align: left; margin: 15px 0; padding-left: 20px; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h2>智慧藥盒監控</h2>
        <div id="clock" style="font-size: 1.5em; font-weight: bold; margin-bottom: 10px;">00:00:00</div>
        
        <div>ESP32 狀態: <span id="esp-dot" class="status-dot bg-offline"></span></div>
        <div id="schedule-container" style="text-align: left; margin-top: 15px;">
            <strong>目前排程:</strong>
            <ul id="schedule-list"><li>載入中...</li></ul>
        </div>
        
        <input type="time" id="timeInput">
        <button onclick="sendTime()">新增排程</button>
        <div id="status-box" style="margin-top: 20px; padding: 10px;">系統初始化中...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script>
        let lastSeen = Date.now();
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_" + parseInt(Math.random() * 100));
        
        client.onMessageArrived = (msg) => {
            // 每當收到任何訊息，更新心跳時間並顯示為在線
            lastSeen = Date.now();
            document.getElementById("esp-dot").className = "status-dot bg-online";

            if (msg.destinationName === "pillbox/status") {
                document.getElementById("status-box").innerText = msg.payloadString === "Taken" ? "✅ 已領取" : "⚠️ 等待中";
            } else if (msg.destinationName === "pillbox/config_ack") {
                document.getElementById("schedule-list").innerHTML = 
                    msg.payloadString.split(", ").map(t => `<li>🕒 ${t}</li>`).join('');
            }
        };

        // 心跳監控器：每 2 秒檢查一次，若超過 15 秒沒訊息，判定為離線
        setInterval(() => {
            if (Date.now() - lastSeen > 15000) {
                document.getElementById("esp-dot").className = "status-dot bg-offline";
            }
        }, 2000);

        client.connect({ useSSL: true, onSuccess: () => {
            client.subscribe("pillbox/status");
            client.subscribe("pillbox/config_ack");
        }});

        function sendTime() {
            client.send("pillbox/set_time", document.getElementById("timeInput").value);
        }
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString('zh-TW', { hour12: false }), 1000);
    </script>
</body>
</html>
