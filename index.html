<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧取藥機監控中心</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        #status-box { font-size: 2em; padding: 20px; border: 2px solid #ccc; display: inline-block; }
        .taken { color: green; }
        .waiting { color: blue; }
    </style>
</head>
<body>
    <h1>藥物狀態監控</h1>
    <div id="status-box" class="waiting">系統連線中...</div>

    <script>
        // 設定 MQTT 參數
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8000, "web_client_" + parseInt(Math.random() * 100));

        client.onMessageArrived = function(message) {
            const statusBox = document.getElementById("status-box");
            if (message.payloadString === "Taken") {
                statusBox.innerHTML = "✅ 藥物已領取";
                statusBox.className = "taken";
            } else {
                statusBox.innerHTML = "❌ 取藥失敗/等待中";
                statusBox.className = "waiting";
            }
        };

        client.connect({
            onSuccess: () => {
                client.subscribe("pillbox/status");
                document.getElementById("status-box").innerHTML = "🕒 等待取藥中...";
            }
        });
    </script>
</body>
</html>
