<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧藥盒監控中心</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding-top: 30px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .schedule-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="card">
        <h2>多段排程控制</h2>
        <div id="schedule-list" style="margin: 15px 0; text-align: left;"></div>
        <input type="time" id="timeInput">
        <button onclick="addSchedule()">新增排程</button>
        <button onclick="saveSchedules()" style="background: #27ae60; color: white; border:none; padding: 5px 10px;">儲存並發送</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script>
        let schedules = [];
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_" + parseInt(Math.random() * 100));

        client.connect({ useSSL: true, onSuccess: () => client.subscribe("pillbox/config_ack") });

        function addSchedule() {
            const time = document.getElementById("timeInput").value;
            if (time) {
                schedules.push({ time: time });
                updateList();
            }
        }

        function updateList() {
            document.getElementById("schedule-list").innerHTML = schedules.map(s => 
                `<div class="schedule-item"><span>🕒 ${s.time}</span></div>`).join('');
        }

        function saveSchedules() {
            client.send("pillbox/set_schedule", JSON.stringify(schedules));
        }
    </script>
</body>
</html>
