<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧藥盒監控中心</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding-top: 30px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        #schedule-list { text-align: left; margin: 15px 0; padding-left: 20px; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h2>智慧藥盒監控</h2>
        <div id="schedule-container" style="text-align: left;">
            <strong>目前排程:</strong>
            <ul id="schedule-list"><li>等待 ESP32 連線...</li></ul>
        </div>
        <input type="time" id="timeInput">
        <button onclick="sendTime()">新增排程</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script>
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_" + parseInt(Math.random() * 100));
        client.onMessageArrived = (msg) => {
            if (msg.destinationName === "pillbox/config_ack") {
                document.getElementById("schedule-list").innerHTML = 
                    msg.payloadString.split(", ").map(t => `<li>🕒 ${t}</li>`).join('');
            }
        };
        client.connect({ useSSL: true, onSuccess: () => client.subscribe("pillbox/config_ack") });
        function sendTime() {
            client.send("pillbox/set_time", document.getElementById("timeInput").value);
        }
    </script>
</body>
</html>
