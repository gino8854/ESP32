<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧取藥機監控中心</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        #status-box { font-size: 2em; padding: 20px; border: 2px solid #ccc; display: inline-block; margin: 20px; }
        .net-status { font-size: 1em; margin: 5px; padding: 5px; border-radius: 5px; display: inline-block; }
        
        /* 狀態顏色 */
        .online { color: white; background-color: #28a745; }
        .offline { color: white; background-color: #dc3545; }
        .taken { color: green; }
        .waiting { color: blue; }
    </style>
</head>
<body>
    <h1>藥物狀態監控</h1>
    
    <div>
        <span id="browser-net" class="net-status">🌐 網路檢查中...</span>
        <span id="mqtt-net" class="net-status">🔌 MQTT 連線中...</span>
    </div>

    <div id="status-box" class="waiting">系統初始化...</div>

    <script>
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_client_" + parseInt(Math.random() * 100));
        
        const statusBox = document.getElementById("status-box");
        const mqttStatus = document.getElementById("mqtt-net");
        const browserStatus = document.getElementById("browser-net");

        // 1. 監控瀏覽器網路狀態
        function updateBrowserStatus() {
            if (navigator.onLine) {
                browserStatus.innerHTML = "🌐 網路連線正常";
                browserStatus.className = "net-status online";
            } else {
                browserStatus.innerHTML = "🌐 網路已中斷";
                browserStatus.className = "net-status offline";
            }
        }
        window.addEventListener('online', updateBrowserStatus);
        window.addEventListener('offline', updateBrowserStatus);
        updateBrowserStatus(); // 初始化執行

        // 2. MQTT 狀態處理
        client.onConnectionLost = (responseObject) => {
            mqttStatus.innerHTML = "🔌 MQTT 已斷線";
            mqttStatus.className = "net-status offline";
            statusBox.innerHTML = "⚠️ 系統連線異常";
        };

        client.onMessageArrived = (message) => {
            if (message.payloadString === "Taken") {
                statusBox.innerHTML = "✅ 藥物已領取";
                statusBox.className = "taken";
            } else {
                statusBox.innerHTML = "❌ 取藥失敗/等待中";
                statusBox.className = "waiting";
            }
        };

        client.connect({
            useSSL: true,
            onSuccess: () => {
                client.subscribe("pillbox/status");
                mqttStatus.innerHTML = "🔌 MQTT 已連線";
                mqttStatus.className = "net-status online";
                statusBox.innerHTML = "🕒 等待取藥中...";
            },
            onFailure: (err) => {
                mqttStatus.innerHTML = "🔌 MQTT 連線失敗";
                mqttStatus.className = "net-status offline";
            }
        });
    </script>
</body>
</html>
