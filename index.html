<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 LED 遠端開關</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 280px; }
        h2 { color: #1c1e21; margin-bottom: 25px; }
        button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-on { background-color: #28a745; color: white; }
        .btn-off { background-color: #dc3545; color: white; }
        button:active { transform: scale(0.98); }
        #status { font-size: 0.85rem; color: #65676b; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>LED 遠端控制</h2>
        
        <button class="btn-on" onclick="sendCmd('ON')">點亮 LED</button>
        <button class="btn-off" onclick="sendCmd('OFF')">關閉 LED</button>

        <div id="status">連線中...</div>
    </div>

    <script>
        const broker = "broker.emqx.io";
        const port = 8084;
        const topicLed = "ginohome/esp32/led";
        const clientId = "Web_LED_" + Math.random().toString(16).substr(2, 5);

        const client = new Paho.MQTT.Client(broker, port, clientId);

        const options = {
            useSSL: true,
            onSuccess: () => {
                document.getElementById("status").innerText = "連線狀態：已連線";
            },
            onFailure: (err) => {
                document.getElementById("status").innerText = "連線失敗: " + err.errorMessage;
            }
        };

        client.connect(options);

        function sendCmd(state) {
            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(state);
                message.destinationName = topicLed;
                client.send(message);
                console.log("已送出: " + state);
            }
        }
    </script>
</body>
</html>
